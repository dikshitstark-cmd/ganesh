{% extends "base.html" %}
{% block title %}New Receipt{% endblock %}
{% block content %}

<div class="page-head">
  <h1>New Receipt</h1>
</div>

<div class="form-card">
  {% if error %}
    <div class="flash flash-error">{{ error }}</div>
  {% endif %}

  <form method="post">
    <div class="form-grid">
      <div class="form-field">
        <label>Name *</label>
        <input type="text" name="name" required value="{{ request.form.get('name', '') }}">
      </div>
      <div class="form-field">
        <label>Phone (for WhatsApp only, not printed)</label>
        <input type="text" name="phone" placeholder="e.g. 91XXXXXXXXXX" value="{{ request.form.get('phone', '') }}">
      </div>
      <div class="form-field form-field-wide">
        <label>Address *</label>
        <textarea name="address" rows="2" required>{{ request.form.get('address', '') }}</textarea>
      </div>
      <div class="form-field">
        <label>Purpose</label>
        <input type="text" name="purpose" value="{{ request.form.get('purpose', 'Ganesh Chanda') }}">
      </div>
      <div class="form-field">
        <label>Payment Mode</label>
        <select name="mode">
          {% for m in modes %}
            <option value="{{ m }}">{{ m }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-field">
        <label>Total Amount (₹) *</label>
        <input type="number" step="0.01" min="0.01" name="total_amount" required value="{{ request.form.get('total_amount', '') }}">
      </div>
      <div class="form-field">
        <label>Payment Status</label>
        <select name="payment_status" id="paymentStatus" onchange="togglePaidField()">
          <option value="unpaid">Unpaid</option>
          <option value="paid">Paid in Full</option>
          <option value="partial">Partial Payment</option>
        </select>
      </div>
      <div class="form-field" id="paidAmountField" style="display:none;">
        <label>Paid Amount (₹)</label>
        <input type="number" step="0.01" min="0" name="paid_amount" value="{{ request.form.get('paid_amount', '0') }}">
      </div>
      <div class="form-field form-field-wide checkbox-field">
        <label>
          <input type="checkbox" name="show_qr" {% if request.form.get('show_qr', 'on') == 'on' %}checked{% endif %}>
          Show UPI QR code on this receipt
        </label>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Create Receipt</button>
      <a class="btn btn-outline" href="{{ url_for('dashboard') }}">Cancel</a>
    </div>
  </form>
</div>

<script>
function togglePaidField() {
  const status = document.getElementById("paymentStatus").value;
  document.getElementById("paidAmountField").style.display = (status === "partial") ? "block" : "none";
}
</script>
{% endblock %}
