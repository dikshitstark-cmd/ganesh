<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Receipt {{ r.receipt_no }}</title>
{% if not for_pdf %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
{% endif %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/receipt.css') }}">
</head>
<body>

{% if not standalone %}
<div class="toolbar no-print">
  <a href="{{ url_for('dashboard') }}">&larr; Back to Dashboard</a>
  <button onclick="window.print()">🖨 Print / Save as PDF</button>
</div>
{% endif %}

{% import "_receipt_body.html" as rb %}
<div class="a4-page single">
  {{ rb.receipt_body(r) }}
</div>

</body>
</html>
