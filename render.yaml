services:
  - type: web
    name: ganesh-utsav-receipts
    env: python
    buildCommand: "pip install -r requirements.txt && python generate_placeholders.py"
    startCommand: "gunicorn -w 4 -b 0.0.0.0:$PORT app:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: FORCE_SECURE_COOKIES
        value: "1"
    disk:
      name: data
      mountPath: /opt/render/project/src
      sizeGB: 1